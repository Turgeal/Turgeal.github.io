<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Homepage</title>
<link rel="stylesheet" href="assets/styles.css?v=20260929a">
<link rel="icon" href="data:,">
</head>
<body>
<header class="site-header">
  <nav class="lang-switch">
    <button type="button" class="lang-btn is-current" data-lang="en" aria-pressed="true" aria-label="Switch to English">EN</button>
    <span class="lang-sep" aria-hidden="true">/</span>
    <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false" aria-label="Switch to Chinese">中文</button>
  </nav>
</header>
<main>
  <section class="hero" aria-labelledby="brief-heading">
    <img class="portrait" id="portrait"
         src="assets/portrait-400.jpg"
         srcset="assets/portrait-400.jpg 1x, assets/portrait-800.jpg 2x"
         width="400" height="400" loading="eager"
         alt="Portrait photo of the author.">
    <div class="hero-text">
      <div class="heading-row">
        <h1 class="block-heading" id="brief-heading">Brief</h1>
      </div>
      <div id="brief-lines"></div>
    </div>
  </section>

  <section class="section">
    <div class="heading-row">
      <h2 class="block-heading" id="outside-heading"></h2>
    </div>
    <ul class="plain-list" id="outside-list"></ul>
    <div class="heading-row">
      <h2 class="block-heading" id="course-heading"></h2>
    </div>
    <p class="list-label" id="nontrivial-label"></p>
    <ul class="plain-list" id="nontrivial-list"></ul>
    <p class="list-label" id="trivial-label"></p>
    <ul class="plain-list" id="trivial-list"></ul>
    <p class="course-note" id="course-note"></p>
  </section>

  <section class="section" id="others-section" aria-labelledby="others-heading">
    <div class="heading-row">
      <h2 class="block-heading" id="others-heading"></h2>
    </div>
    <ul class="plain-list" id="others-list"></ul>
  </section>
</main>
<script src="assets/content.js?v=20260929a"></script>
<script src="assets/app.js?v=20260929a"></script>
</body>
</html>
